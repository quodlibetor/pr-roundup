[package]
name = "pr-roundup"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/quodlibetor/pr-roundup"
description = "A local page that groups your open pull requests by tag and copies them for Slack"

# `publish = false` would otherwise keep dist from building the binary.
[package.metadata.dist]
dist = true

[dependencies]
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6"
jiff = { version = "1.0", default-features = false, features = ["std"] }
maud = { version = "0.27", features = ["axum"] }
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webbrowser = "1.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"

# The profile dist builds releases with.
[profile.dist]
inherits = "release"
lto = "thin"
